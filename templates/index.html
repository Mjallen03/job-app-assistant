<!DOCTYPE html>
<html>
<head>
    <title>Job Application Assistant</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f4f4f4;
        }
        h1 {
            color: #333;
        }
        textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-family: Arial, sans-serif;
        }
        button {
            background-color: #2c7be5;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #1a5fc1;
        }
        .result {
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            margin-top: 20px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <h1>Job Application Assistant</h1>
    <form method="POST">
        <label>Job Description:</label>
        <textarea name="job_description" rows="8" required></textarea>

        <label>Your Resume:</label>
        <textarea name="resume" rows="8" required></textarea>

        <button type="submit">Analyze</button>
    </form>

    {% if result %}
    <div class="result">
        <h2>Analysis</h2>
        {{ result }}
    </div>
    {% endif %}
</body>
</html>
